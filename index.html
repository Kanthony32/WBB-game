function ensure(g){
  if(!g)return g;
  g.coach=g.coach||{};
  const c=g.coach;
  c.fam=c.fam||{off:50,def:50};
  c.practice=c.practice||{focus:'balanced',intensity:'normal'};
  if(!FOCI[c.practice.focus])c.practice.focus='balanced';
  if(!INTENSITY[c.practice.intensity])c.practice.intensity='normal';
  c.depth=clamp(+c.depth||8,7,10);
  c.cond=clamp(+c.cond||0,0,100);
  c.prep=c.prep||0;c.met=c.met||{};
  /* hidden recruit traits are re-rolled for every career */
  if(!c.seed)c.seed=(hash(g.school+'|'+g.manager)^(Date.now()>>>0))>>>0||1;
  if(!OFF[g.tactics.offense])g.tactics.offense='Motion';
  if(!DEF[g.tactics.defense])g.tactics.defense='Man-to-Man';
  if(!PACES[g.tactics.pace])g.tactics.pace='Balanced';
  for(const p of g.roster){
    prime(p);
    if(!Number.isFinite(p.morale))p.morale=70;
    if(!Number.isFinite(p.xp))p.xp=0;
    if(!Number.isFinite(p.fatigue))p.fatigue=0;
  }
  /* every program has a few under-the-radar players who want to be there */
  if(c.fanSeason!==g.season){
    c.fanSeason=g.season;
    const pool=g.prospects.filter(p=>p.depth&&!p.committed&&!p.signedElsewhere&&Core.arrival(g,p)<=g.season+1).sort((a,b)=>unit01(c.seed+'|'+a.id+'|fan')-unit01(c.seed+'|'+b.id+'|fan')).slice(0,3);
    for(const p of pool)p.fan=true;
    if(pool.length)Core.log(g,`${pool.map(p=>p.name).join(', ')} have told your staff they want to play at ${g.school}. They will wait for you into the spring.`);
  }
  for(const p of [...g.prospects,...g.portal]){
    const portal=!Number.isFinite(+p.cls);
    prime(p,portal?p.cls:'FR');
    if(!p.rp){
      p.rp=profile(g,p,portal);
      if(p.fan){p.rp.fan=true;p.rp.scout=Math.max(1,p.rp.scout);if(activeCount(g)<BOARD_MAX)p.rp.tier='active';}
      /* signing calendar: next year's class decides this season, the class after that next season. */
      if(!portal&&p.recruit2){
        const soon=Core.arrival(g,p)<=g.season+1,u=unit01(c.seed+'|'+p.id+'|dl');
        /* the late market decides last: they are still there after the season */
        const d=p.depth?Core.wk(g)+Math.max(3,27-g.week):Core.wk(g)+Math.max(3,(soon?8+Math.floor(u*13):28+6+Math.floor(u*13))-g.week);
        const at=Core.weekLabel(d);
        p.recruit2.deadline=d;p.recruit2.deadlineSeason=at.season;p.recruit2.deadlineWeek=at.week;
      }
      /* real-world commitments from the 4PN database are honoured as they stand. */
      if(p.commit){
        if(p.commit===g.school){p.committed=true;p.offered=true;p.status='Signed';p.rp.tier='active';p.rp.scout=3;}
        else{p.signedElsewhere=true;p.status=`Committed to ${p.commit}`;}
      }
    }
    const r=p.rp;
    if(!r.arch){r.arch='winner';r.tier=r.tier||'active';}
    if(r.tier===undefined)r.tier='active';
    if(r.scout===undefined)r.scout=p.hiddenUnlocked?1:0;
    if(r.mom===undefined)r.mom=0;
    if(r.last===undefined)r.last=Core.wk(g);
  }
  /* the staff's first board each season: the best-looking open races at spots you need. */
  if(c.boardSeason!==g.season){
    c.boardSeason=g.season;
    const short=needs(g).filter(n=>n.short).map(n=>n.pos);
    const open=g.prospects.filter(p=>p.rp&&p.rp.tier==='watch'&&!closed(p)&&Core.arrival(g,p)===g.season+1);
    open.sort((a,b)=>(short.includes(Core.pos(b))-short.includes(Core.pos(a)))||race(g,b).lead-race(g,a).lead);
    for(const p of open.slice(0,Math.max(0,8-activeCount(g))))p.rp.tier='active';
  }
  return g;
}

/* ---------------- team ratings ---------------- */
/* what a player of this position and overall "should" look like */
function expected(p){
  const pos=posOf(p),e={};
  for(const k of KEYS)e[k]=p.ovr+POSB[pos][k];
  const shift=p.ovr-weighted(e,pos);
  for(const k of KEYS)e[k]+=shift;
  return e;
}
function vector(list){
  /* list: [{p, w}] -> talent level T, mean attributes A, and the deviation D that
     systems are scored on. D has two parts: how each player differs from a
     typical player at her position (her real strengths), and a smaller term for
     the lineup's shape (three guards shoot more and rebound less than two bigs). */
  const A={},D={};let tw=0,t=0;for(const k of KEYS){A[k]=0;D[k]=0;}
  for(const {p,w} of list){
    const e=expected(p),pos=posOf(p);
    tw+=w;t+=p.ovr*w;
    for(const k of KEYS){A[k]+=p.attr[k]*w;D[k]+=((p.attr[k]-e[k])+.3*(POSB[pos][k]-BASE[k]))*w;}
  }
  if(!tw)return {A,T:60,D};
  for(const k of KEYS){A[k]/=tw;D[k]/=tw;}
  return {A,T:t/tw,D};
}
function ourUnit(g){
  const rot=Core.rotationOf(g);
  const list=rot.map(x=>({p:g.roster.find(r=>r.id===x.id),w:x.on?1:.25})).filter(x=>x.p&&x.p.attr);
  return {...vector(list),rot,five:list.filter(x=>x.w===1).map(x=>x.p),bench:list.filter(x=>x.w<1).map(x=>x.p)};
}
/* points of game-day edge per point of system fit */
const FIT=1.7;
const fit=(D,w)=>Object.entries(w).reduce((a,[k,v])=>a+v*D[k],0);
/* each system is scored against the average of all of them, so the number says
   how much better or worse this group is in THIS system than in a typical one. */
function centred(table,D){
  const raw=Object.entries(table).map(([k,s])=>[k,fit(D,s.w)]);
  const mean=raw.reduce((a,x)=>a+x[1],0)/raw.length;
  return Object.fromEntries(raw.map(([k,v])=>[k,v-mean]));
}
function fits(D){return {off:centred(OFF,D),def:centred(DEF,D)};}
const styleCache=new Map();
function styleOf(school){
  if(styleCache.has(school))return styleCache.get(school);
  const prog=(DATA.programs||[]).find(p=>p.school===school);
  let out={off:'Motion',def:'Man-to-Man',pace:'Balanced',top:[]};
  if(prog&&prog.roster.length){
    const eight=prog.roster.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,8).map((p,i)=>({p:prime({...p}),w:i<5?1:.25}));
    const v=vector(eight),f=fits(v.D);
    const best=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0][0];
    out={off:best(f.off),def:best(f.def),pace:v.D.ATH>1.5?'Fast':v.D.IQ>1.5?'Slow':'Balanced',
      top:eight.slice(0,3).map(x=>({name:x.p.name,pos:x.p.pos,ovr:x.p.ovr,arch:archetype(x.p)}))};
  }
  styleCache.set(school,out);return out;
}
const staff=(g,id)=>((g.staff||[]).find(s=>s.id===id)||{rating:74}).rating;
const facility=(g,id)=>((g.facilities||[]).find(s=>s.id===id)||{level:2}).level;
const mult=(g,id,span)=>1+(staff(g,id)-74)/span;
function report(g,opp){
  ensure(g);
  const u=ourUnit(g),f=fits(u.D),c=g.coach,t=g.tactics;
  const fo=f.off[t.offense]*FIT,fd=f.def[t.defense]*FIT;
  const fam=((c.fam.off-50)*CX_PAY[CX[t.offense]]+(c.fam.def-50)*CX_PAY[CX[t.defense]])/100*3;
  const benchAvg=u.bench.length?u.bench.reduce((a,p)=>a+p.ovr,0)/u.bench.length:u.T-12;
  const fiveAvg=u.five.length?u.five.reduce((a,p)=>a+p.ovr,0)/u.five.length:u.T;
  const depthQ=clamp((benchAvg-(fiveAvg-9))/5,-1.5,1.5);
  const pace=t.pace==='Fast'?u.D.ATH*.35+depthQ*.6:t.pace==='Slow'?u.D.IQ*.35:0;
  const depth=(8-c.depth)*.45+(c.depth>8?depthQ*.3*(c.depth-8):0);
  const fatigue=u.five.length?u.five.reduce((a,p)=>a+(p.fatigue||0),0)/u.five.length:0;
  const tired=Math.max(0,(fatigue-35)/11);
  const morale=g.roster.length?g.roster.reduce((a,p)=>a+(p.morale??70),0)/g.roster.length:70;
  const mood=(morale-65)/22;
  const bench=(staff(g,'tac')-74)/12;
  const prep=c.prep?1.6:0;
  let matchup=0,style=null;
  if(opp){style=styleOf(opp);matchup=vs(t.defense,style.off)-vs(style.def,t.offense);}
  const edge=fo+fd+fam+pace+depth-tired+mood+bench+prep+matchup;
  return {unit:u,fits:f,T:u.T,off:u.T+fo+(c.fam.off-50)/25,def:u.T+fd+(c.fam.def-50)/25,
    parts:{system:fo+fd,familiarity:fam,pace,depth,fatigue:-tired,morale:mood,staff:bench,prep,matchup},
    edge,fatigue,morale,style};
}
const edge=(g,opp)=>report(g,opp).edge;

/* ---------------- settings ---------------- */
function setTactic(g,kind,value){
  ensure(g);
  const table={offense:OFF,defense:DEF,pace:PACES}[kind];
  if(!table||!table[value])throw Error('Unknown tactic.');
  if(g.tactics[kind]===value)return;
  g.tactics[kind]=value;
  /* a new system has to be learned: most of the old familiarity is gone. */
  if(kind==='offense'){g.coach.fam.off=Math.round(g.coach.fam.off*.45);Core.log(g,`Offense changed to ${value}. Familiarity resets to ${g.coach.fam.off}.`);}
  if(kind==='defense'){g.coach.fam.def=Math.round(g.coach.fam.def*.45);Core.log(g,`Defense changed to ${value}. Familiarity resets to ${g.coach.fam.def}.`);}
}
function setDepth(g,n){ensure(g);g.coach.depth=clamp(Math.round(+n)||8,7,10);}
function setPractice(g,field,value){
  ensure(g);
  if(field==='focus'&&FOCI[value])g.coach.practice.focus=value;
  else if(field==='intensity'&&INTENSITY[value])g.coach.practice.intensity=value;

function setFocus(g,id,key){

function meet(g,id){

const staffCost=s=>25000+Math.max(0,s.rating-70)*2500;
const facilityCost=f=>90000*f.level;
function upgradeStaff(g,id){

/* ---------------- development ---------------- */
const CLS_GAIN={FR:.42,SO:.34,JR:.24,SR:.14};
function addPoint(g,p){
  const w=POSW[posOf(p)];
  let key=p.focus;
  if(!key||p.attr[key]>=99){
    let x=rand(g),pick=KEYS[0];
    for(const k of KEYS){x-=w[k];if(x<=0){pick=k;break;}}
    key=pick;
  }
  if(p.attr[key]>=99)return false;
  p.attr[key]+=1;
  p.ovr=Math.min(p.pot,ovrOf(p));
  return true;
}
function develop(g,scale){
  const base=mult(g,'dev',50)*(1+(facility(g,'practice')-2)*.09)*scale*(typeof Prog!=='undefined'?Prog.devMult(g):1);
  for(const p of g.roster){
    if(p.injured)continue;
    p.xp=(p.xp||0)+(CLS_GAIN[p.cls]||.5)*base*(p.ovr<p.pot?1:.2);
    let guard=0;
    while(p.xp>=1&&guard++<6){p.xp-=1;addPoint(g,p);}
  }
}
/* the summer between seasons: growth toward potential, fresh legs, a reset mood. */
function offseason(g){
  ensure(g);
  const up=[];
  for(const p of g.roster){
    if(p.arrivedSeason===g.season){p.morale=72;continue;}
    const before=p.ovr,gap=Math.max(0,p.pot-p.ovr);
    const target=Math.min(p.pot,p.ovr+Math.round(gap*(.14+rand(g)*.2)*mult(g,'dev',60)));
    let guard=0;
    while(p.ovr<target&&guard++<80)addPoint(g,p);
    if(p.ovr-before>=2)up.push([p.name,before,p.ovr]);
    p.morale=Math.round(((p.morale??70)+72)/2);p.fatigue=0;
  }
  g.coach.fam.off=Math.max(30,g.coach.fam.off-12);g.coach.fam.def=Math.max(30,g.coach.fam.def-12);
  g.coach.cond=Math.round(g.coach.cond*.4);g.coach.prep=0;
  g.an=null;g.live=null;for(const p of g.roster)p.tot=null;
  up.sort((a,b)=>(b[2]-b[1])-(a[2]-a[1]));
  if(up.length)Core.log(g,`Summer development: ${up.slice(0,4).map(x=>`${x[0]} ${x[1]}→${x[2]}`).join(', ')}.`);
  return up;
}

/* ---------------- the weekly tick ---------------- */
function week(g,games){
  ensure(g);
  const c=g.coach,f=FOCI[c.practice.focus],it=INTENSITY[c.practice.intensity];
  const inSeason=g.week<=23,tac=mult(g,'tac',50);
  c.fam.off=clamp(Math.round(c.fam.off+f.off*it.gain*tac*CX_LEARN[CX[g.tactics.offense]]),0,100);
  c.fam.def=clamp(Math.round(c.fam.def+f.def*it.gain*tac*CX_LEARN[CX[g.tactics.defense]]),0,100);
  if(f.cond)c.cond=clamp(c.cond+f.cond*it.gain,0,100);
  c.prep=f.prep?1:0;
  develop(g,f.dev*it.gain*(inSeason?1:1.3));
  const rot=Core.rotationOf(g),five=rot.filter(x=>x.on).map(x=>x.id),inRot=rot.map(x=>x.id);
  const avgRot=rot.length?rot.reduce((a,x)=>a+x.ovr,0)/rot.length:70;
  const w=(games||[]).filter(x=>x.result==='W').length,l=(games||[]).filter(x=>x.result==='L').length;
  const recLvl=facility(g,'recovery');
  const rest=9+recLvl*2.5+(f.rest||0)-it.fatigue;
  const hurt=[];
  for(const p of g.roster){
    p.fatigue=clamp((p.fatigue||0)-rest,0,100);
    if(p.injured&&f.rest&&p.injuredWeeks>1)p.injuredWeeks-=1;

const FACTORS=[['time','Playing time'],['dev','Development'],['acad','Academics'],['home','Close to home'],['win','Winning'],['nil','NIL'],['cult','Culture and support']];

  const n=g.record.w+g.record.l;
  if(n>=5)return g.record.w/n;

  if(h&&(h.w+h.l))return h.w/(h.w+h.l);

}
function grades(g,p){
  const offset=Math.max(0,Core.arrival(g,p)-g.season),pos=Core.pos(p);
  const ahead=Core.projected(g,offset).filter(x=>x.id!==p.id&&Core.pos(x)===pos&&x.ovr>=p.ovr-2).length;
  const rp=p.rp;
  return {
    time:[95,76,56,38,28][Math.min(4,ahead)],
    dev:clamp(38+(staff(g,'dev')-60)+facility(g,'practice')*6,20,100),
    acad:clamp(38+facility(g,'academic')*10+g.prestige*2+(typeof Leg!=='undefined'?Leg.academicBonus(g):0),20,100),
    home:rp.dist?homeGrade(g.school,rp):proximity(regionOf(g.school),rp.region),
    win:clamp(g.prestige*13+seasonPct(g)*35,15,100),

function composite(g,p){const gr=grades(g,p),rp=dm(g,p);return FKEYS.reduce((a,k)=>a+rp.w[k]*gr[k],0);}

function pitch(g,id,key){

  const p=Core.contact(g,id,'pitch');

  if(g.week===23&&g.tournaments&&g.tournaments.ncaa&&g.tournaments.ncaa.season===g.season){
    const t=g.tournaments.ncaa;

}

/* Demo-only: offers can land. The real commit logic belongs in your recruiting
   code; this keeps the offer -> commit -> arrival loop playable. */
function resolveOffers(g){
  const commits=[],abs=g.season*Core.WEEKS+g.week;
  for(const p of [...g.prospects,...g.portal]){
    if(p.committed||p.signedElsewhere||!p.offered)continue;
    if(p.recruit2&&abs>p.recruit2.deadline)continue;
    const chance=Math.max(0.02,Math.min(0.5,(p.meters.interest-40)/110+(p.meters.trust-40)/140+(p.meters.fit-50)/180));
    if(rand(g)<chance){p.committed=true;p.status='Committed';commits.push(p);Core.log(g,`${p.name} committed to ${g.school}.`);}
  }

function nextWeek(g,opts){
  /* interactive weeks pass auto:false, which plays one tournament game and
     waits for the page; everything else resolves in one go. */
  const auto=!(opts&&opts.auto===false);
  if(g.week>=WEEKS)return {games:[],commits:[],lost:[],tournaments:[],box:null,exits:[],finished:true};
  if(!auto){
    const stuck=queuedTournament(g);

      if(!stuck.pending)runQueue(g,stuck,false);

  const moved=Coach.week(g,games),commits=moved.commits,lost=moved.lost;
  const tournaments=tournamentWeek(g,auto);
  const exits=[offseasonExit(g)].filter(Boolean);
  if(games.length)Core.log(g,`Week ${g.week}: ${games.map(x=>`${x.result==='W'?'beat':'lost to'} ${x.opp} ${x.score[0]}-${x.score[1]}`).join('; ')}.`);
  const res={games,commits,lost,flips:moved.flips||[],tournaments,box:null,timeout:null,exits,finished:g.week>=WEEKS};
  Prog.week(g,res);
  return res;
}

return {WEEKS,TIMEOUTS,gameWeek,teamStrength,nextWeek,playNextGame,coachTimeout,substitute,rotationOf,queuedTournament,pendingGame};
})();

function canLearn(g,key){

  for(const b of Object.values(TREE)){const i=b.skills.findIndex(s=>s[0]===key);if(i>0&&!me.skills[b.skills[i-1][0]])return `Learn ${b.skills[i-1][1]} first.`;if(i>=0)return '';}

const detail=g=>{ensure(g);const a=asst(g,'off');return (perk(g,'detail')?.4:0)+(a?(a.rating-70)/45:-.2);};
const ddetail=g=>{ensure(g);const a=asst(g,'def');return a?(a.rating-70)/45:-.2;};
const filmBonus=g=>(perk(g,'film')?1:0)+((g.pg&&g.pg.cal&&g.pg.cal.film)||0);
const devMult=g=>(1+(perk(g,'teacher')?.15:0))*(typeof Leg!=='undefined'?Leg.devMult(g):1);

/* ---------------- daily calendar ---------------- */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const ACTS={
  practice:{label:'Practice',note:'System understanding up on both ends. Legs a little heavier.'},
  film:{label:'Film',note:'Scout the next opponent: your defense recognises their favourite calls sooner. Two sessions max.',max:2},
  recover:{label:'Recovery',note:'Fresh legs for everyone.'},
  recruit:{label:'Recruiting calls',note:'+1 action point to spend today. Twice a week max.',max:2},
  team:{label:'Team time',note:'Morale and chemistry rise. Twice a week max.',max:2},
  skill:{label:'Skill work',note:'Extra development for your four youngest players.'}
};
const hasGame=g=>{const n=Coach.nextGame(g);return !!(n&&n.week===g.week+1&&g.week<20)||(g.week>=20&&g.week<=22);};
function plan(g){
  const c=ensure(g).cal,game=hasGame(g);
  const def=game?['practice','film','recover','practice','recruit']:['practice','recruit','skill','team','recover','practice'];
  return DAYS.map((d,i)=>({day:d,i,type:i===6?'off':(i===5&&game)?'game':'pick',done:c.log[i]||null,def:def[i]||null,now:i===c.day}));

function doDay(g,key){
  const c=ensure(g).cal,p=plan(g)[c.day];

  if(a.max&&(c.n[key]||0)>=a.max)throw Error(`${a.label}: ${a.max} a week is the limit.`);

  const fam=g.coach.fam;
  if(key==='practice'){fam.off=clamp(fam.off+1.2,0,100);fam.def=clamp(fam.def+1.2,0,100);for(const x of g.roster)x.fatigue=clamp((x.fatigue||0)+1.5,0,100);}
  if(key==='film')c.film=Math.min(2,c.film+1);
  if(key==='recover')for(const x of g.roster)x.fatigue=clamp((x.fatigue||0)-(perk(g,'recovery')?8:5),0,100);
  if(key==='recruit')g.ap+=1;

  if(key==='skill'){const ord={FR:0,SO:1,JR:2,SR:3};g.roster.filter(x=>!x.injured).sort((a,b)=>(ord[a.cls]??2)-(ord[b.cls]??2)||b.pot-a.pot).slice(0,4).forEach(x=>{x.xp=(x.xp||0)+.22*devMult(g);});}

}
/* the staff runs whatever you left unscheduled */
function finishDays(g){
  const c=ensure(g).cal;let guard=0;
  while(c.day<7&&guard++<8){
    const p=plan(g)[c.day];
    if(p.type!=='pick'){c.log[c.day]=p.type;c.day+=1;continue;}
    let k=p.def||'practice';
    if(ACTS[k].max&&(c.n[k]||0)>=ACTS[k].max)k='practice';

}
function skipDay(g){const c=ensure(g).cal,p=plan(g)[c.day];if(p&&p.type!=='pick'&&c.day<6){c.log[c.day]=p.type;c.day+=1;}}

/* ---------------- league, bracketology, Selection Sunday ---------------- */
const progs=()=>DATA.programs||[];
const strength=n=>{const p=progs().find(x=>x.school===n);return p&&Number.isFinite(p.strength)?p.strength:70;};
const rating=(g,n)=>n===g.school?Core.strengthOf(g)+1.5:strength(n);
function lg(g){
  const pg=g.pg;
  if(pg.lg&&pg.lg.season===g.season)return pg.lg;
  const t={};
  for(const p of progs())if(p.school!==g.school)t[p.school]={w:0,l:0,cw:0,cl:0,opp:[],beat:[]};
  pg.lg={season:g.season,t,done:{},champs:{}};pg.sel=null;
  return pg.lg;
}
const confOf=n=>{const p=progs().find(x=>x.school===n);return p?p.conference:'';};
function result(L,a,b,aWon,conf){
  (L.wk=L.wk||[]).push({w:aWon?a:b,l:aWon?b:a});
  const A=L.t[a],B=L.t[b];
  if(A){A.opp.push(b);if(aWon){A.w+=1;A.beat.push(b);if(conf)A.cw+=1;}else{A.l+=1;if(conf)A.cl+=1;}}
  if(B){B.opp.push(a);if(!aWon){B.w+=1;B.beat.push(a);if(conf)B.cw+=1;}else{B.l+=1;if(conf)B.cl+=1;}}
}
function lgWeek(g,games){
  const L=lg(g);
  if(g.week<5||g.week>20||L.done[g.week])return;
  L.done[g.week]=1;L.wk=[];
  const busy=new Set();
  for(const gm of games||[]){busy.add(gm.opp);if(L.t[gm.opp])result(L,g.school,gm.opp,gm.result==='W',!!gm.conf);}
  const names=Object.keys(L.t).filter(n=>!busy.has(n));
  for(let i=names.length-1;i>0;i--){const j=Math.floor(R(g)*(i+1));[names[i],names[j]]=[names[j],names[i]];}
  let order=names;
  if(g.week>=11)order=names.slice().sort((a,b)=>confOf(a)<confOf(b)?-1:confOf(a)>confOf(b)?1:0);
  for(let i=0;i+1<order.length;i+=2){
    const a=order[i],b=order[i+1],home=R(g)<.5?2.5:-2.5;

  const L=lg(g),rows=[];

  for(const gm of g.schedule||[])if(gm.played){mine.opp.push(gm.opp);if(gm.result==='W'){mine.w+=1;mine.beat.push(gm.opp);if(gm.conf)mine.cw+=1;}else{mine.l+=1;if(gm.conf)mine.cl+=1;}}

  const ordered=[];
  for(let r=0;r<4;r++)for(const s of SEEDS){const f=field.find(x=>x.region===r&&x.seed===s);if(f)ordered.push(f);}

}
function confField(g){
  const rows=resume(g).filter(r=>r.conf===g.conference).sort((a,b)=>(b.cw-b.cl)-(a.cw-a.cl)||b.score-a.score);
  let top=rows.slice(0,8);
  if(!top.some(r=>r.us)){top[7]=rows.find(r=>r.us);}
  top=top.filter(Boolean);
  top.forEach((r,i)=>{r.seed=i+1;});
  return SEEDS.map(s=>top[s-1]).filter(Boolean).map(r=>({name:r.name,seed:r.seed,region:0}));
}
/* the other leagues crown champions the same week ours does */
function otherChamps(g){
  const L=lg(g),rows=resume(g);
  for(const c of new Set(rows.map(r=>r.conf))){
    if(c===g.conference||L.champs[c])continue;
    let alive=rows.filter(r=>r.conf===c).sort((a,b)=>(b.cw-b.cl)-(a.cw-a.cl)||b.score-a.score).slice(0,8).map(r=>r.name);

function select(g){

    first:p.mine?(p.field.find(f=>f.region===p.mine.region&&f.seed===9-p.mine.seed)||{}).name:''};

/* ---------------- spring retention ---------------- */
const PITCH={
  talk:{label:'Honest conversation',note:'Find out what she actually wants. Small lift on its own.'},
  role:{label:'Promise a bigger role',note:'Strong if minutes are the issue. She will hold you to it next year.'},
  nil:{label:'NIL retention package',note:'Costs NIL money now. Strong if money is the issue.'},
  dev:{label:'Development plan',note:'A written plan with your staff. Strong if she wants to get better.'},
  release:{label:'Wish her well',note:'She leaves today. The room respects it.'}

const ASKS={minutes:'More minutes',nil:'NIL money',dev:'Development',winning:'Winning',home:'Closer to home'};
const nilCost=p=>Math.max(2000,(p.ovr-62)*600);

    const ask=Object.keys(d).sort((a,b)=>d[b]-d[a])[0];

/* what a game is worth: money, and whether they will even come */
function deal(g,school,site){
  const p=progOf(school);

  const P=g.prestige||3,Q=p.prestige||3,opp=Math.round(strength(school));

function filterBoard(list){
  let out=list.slice();
  if(boardView==='open')out=out.filter(p=>!p.committed&&!p.signedElsewhere&&!p.offered);
  if(boardView==='offered')out=out.filter(p=>p.offered&&!p.committed);
  if(boardView==='closed')out=out.filter(p=>p.committed||p.signedElsewhere);
  if(boardPos!=='all')out=out.filter(p=>Core.pos(p)===boardPos);
  const dl=p=>p.recruit2?p.recruit2.deadline:1e9;
  if(boardSort==='ovr')out.sort((a,b)=>(b.ovr||0)-(a.ovr||0));
  if(boardSort==='interest')out.sort((a,b)=>b.meters.interest-a.meters.interest);
  if(boardSort==='deadline')out.sort((a,b)=>dl(a)-dl(b));
  if(boardSort==='race')out.sort((a,b)=>Coach.race(G,b).lead-Coach.race(G,a).lead);
  return out;
}

function placeFive(five){
  const rank=p=>({C:0,F:1,Wing:2,G:3,PG:4})[p.pos]??2;
  const placed=new Array(COURT_SPOTS.length).fill(null);
  let free=COURT_SPOTS.map((_,i)=>i);
  five.slice().sort((a,b)=>rank(a)-rank(b)).forEach(p=>{
    const r=rank(p);
    let best=0;
    for(let k=1;k<free.length;k++)if(Math.abs(free[k]-r)<Math.abs(free[best]-r))best=k;
    placed[free.splice(best,1)[0]]=p;
  });
  return placed;
}

/* ---------------- postseason ---------------- */
function bracketMatch(gm,left,top,seedOf,CH){
  const ours=gm.a===G.school||gm.b===G.school;
  const scored=name=>{
    const idx=gm.a===name?0:1;
    return Array.isArray(gm.score)?gm.score[idx]:'';
  };
  return `<div class="bmatch${ours?' ours':''}" style="left:${left}px;top:${top}px;height:${CH}px">
    <div class="brow${gm.winner===gm.a?' win':''}"><span class="seed">${seedOf(gm.a)||''}</span><span class="bn">${esc(gm.a)}</span><b>${scored(gm.a)}</b></div>
    <div class="brow${gm.winner===gm.b?' win':''}"><span class="seed">${seedOf(gm.b)||''}</span><span class="bn">${esc(gm.b)}</span><b>${scored(gm.b)}</b></div>
  </div>`;
}
function bracketTree(t){
  const field=Array.isArray(t.field)?t.field:[];
  const seedOf=name=>{const i=field.findIndex(x=>x.name===name);return i>=0?i+1:null;};
  const rounds=(t.games||[]).filter(r=>r&&Array.isArray(r.games)&&r.games.length);
  const H=58,CW=176,GAP=40,CH=44,PAD=18;
  if(!rounds.length)return '<p class="empty">No games in this field yet.</p>';
  const centers=[rounds[0].games.map((_,i)=>H*(i+0.5)+PAD)];
  for(let r=1;r<rounds.length;r++){
    const prev=centers[r-1],cur=[];
    for(let i=0;i<prev.length;i+=2)cur.push((prev[i]+(prev[i+1]??prev[i]))/2);
    centers.push(cur);
  }
  const pending=[];
  if(!t.champion&&field.filter(x=>x.alive!==false).length>=2){
    const prev=centers[centers.length-1];
    for(let i=0;i<prev.length;i+=2)pending.push((prev[i]+(prev[i+1]??prev[i]))/2);
  }
  const pendingTeams=[];
  if(pending.length&&rounds.length)rounds[rounds.length-1].games.forEach(gm=>pendingTeams.push(gm.winner));
  const cards=[],lines=[],labels=[];
  rounds.forEach((r,ri)=>{
    labels.push(`<div class="blabel" style="left:${ri*(CW+GAP)}px">${esc(r.round)}</div>`);
    r.games.forEach((gm,gi)=>{
      cards.push(bracketMatch(gm,ri*(CW+GAP),centers[ri][gi]-CH/2,seedOf,CH));
    });
  });
  const pendingX=rounds.length*(CW+GAP);
  if(pending.length){
    const nextName=['Quarterfinal','Semifinal','Final'][Math.min(rounds.length,2)]||'Final';
    labels.push(`<div class="blabel" style="left:${pendingX}px">${nextName}</div>`);
    pending.forEach((c,j)=>{
      const a=pendingTeams[2*j],b=pendingTeams[2*j+1];
      const line=name=>`<div class="brow"><span class="seed">${name?seedOf(name)||'':''}</span><span class="bn">${name?esc(name):'TBD'}</span><b></b></div>`;
      cards.push(`<div class="bmatch pending" style="left:${pendingX}px;top:${c-CH/2}px;height:${CH}px">${line(a)}${line(b)}</div>`);
    });
  }
  const connect=(r,parentIndex,parentY)=>{
    const x1=(r-1)*(CW+GAP)+CW,x2=r*(CW+GAP),mx=x1+GAP/2;
    [2*parentIndex,2*parentIndex+1].forEach(ci=>{
      const y1=centers[r-1][ci];
      if(y1===undefined)return;
      const gm=rounds[r]?rounds[r].games[parentIndex]:null;
      const ours=!!gm&&(gm.a===G.school||gm.b===G.school);
      lines.push(`<path d="M${x1} ${y1} H${mx} V${parentY} H${x2}"${ours?' class="ours"':''}/>`);
    });
  };
  for(let r=1;r<rounds.length;r++)rounds[r].games.forEach((gm,j)=>connect(r,j,centers[r][j]));
  if(pending.length){
    const r=rounds.length;
    pending.forEach((y,j)=>{
      const x1=(r-1)*(CW+GAP)+CW,x2=r*(CW+GAP),mx=x1+GAP/2;
      [2*j,2*j+1].forEach(ci=>{
        const y1=centers[r-1][ci];
        if(y1===undefined)return;
        lines.push(`<path d="M${x1} ${y1} H${mx} V${y} H${x2}"/>`);
      });
    });
  }
  const champX=pending.length?pendingX+CW+GAP:pendingX;
  const lastCenter=centers[centers.length-1][0]??H*0.5;
  const champCard=t.champion?`<div class="bchamp" style="left:${champX}px;top:${lastCenter-CH/2}px;height:${CH}px"><span>Champion</span><b>${esc(t.champion)}</b></div>`:'';
  if(t.champion){
    const edge=(rounds.length-1)*(CW+GAP)+CW;
    lines.push(`<path d="M${edge} ${lastCenter} H${champX}"${t.champion===G.school?' class="ours"':''}/>`);
  }
  const width=Math.max(rounds.length*(CW+GAP),pending.length?pendingX+CW:0,champX+(t.champion?150:0));
  const height=Math.max(...centers.flat().map(c=>c+CH/2))+PAD;
  return `<div class="btree" style="width:${width}px;height:${height}px">
    <svg class="blines" width="${width}" height="${height}" aria-hidden="true">${lines.join('')}</svg>
    ${labels.join('')}${cards.join('')}${champCard}
  </div>`;
}
function bracketCard(t,title){
  if(!t)return `<article class="card reveal"><h2>${title}</h2><p class="meta">Not played yet.</p></article>`;
  if(t.status==='No bid')return `<article class="card reveal"><h2>${esc(t.label||title)}</h2><p class="warn">No bid. Win the conference tournament or finish .600+ to qualify.</p></article>`;
  const st=t.status==='Champion'?'good':/Elim/.test(t.status||'')?'bad':'gold';
  return `<article class="card bracket reveal">
    <header><h2>${esc(t.label||title)}</h2><span class="badge ${st}">${esc(t.status||'')}</span></header>
    <div class="bracket-scroll">${bracketTree(t)}</div>
  </article>`;
}

function recordLine(h){
  const games=(h.w||0)+(h.l||0);
  return `${h.w||0}–${h.l||0}${games?` · ${Math.round((h.w||0)/games*100)}%`:''}`;
}
function historyHTML(){
  const hist=(G.history||[]).slice().reverse();
  if(!hist.length)return `<p class="empty" style="margin-top:20px">No completed seasons yet. Finish this one and it lands here: record, tournament run and what became of your promises.</p>`;
  const sum=hist.reduce((a,h)=>({w:a.w+(h.w||0),l:a.l+(h.l||0),kept:a.kept+((h.promises&&h.promises.kept)||0),broken:a.broken+((h.promises&&h.promises.broken)||0)}),{w:0,l:0,kept:0,broken:0});

/* In the artifact viewer, files go through its downloads capability; elsewhere a
   plain download is tried and the copy-out dialog is always the safety net. */
let DL=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{DL=d;},()=>{});}catch(e){}
function downloadSave(){
  const name=`${G.school}-s${G.season}-w${G.week}.json`.replace(/[^a-z0-9.\-]+/gi,'-');
  const text=JSON.stringify(Core.saveFile(G),null,2);
  if(DL){
    Promise.resolve().then(()=>DL.save({filename:name,data:text}))
      .then(()=>toast(`Saved ${name}.`),()=>{saveModal={name,text};render();});
    return;
  }
  try{
    const blob=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){}
  saveModal={name,text};
  render();
}
function onInput(e){
  if(e.target&&e.target.id==='coach'){coachDraft=e.target.value;return;}

    if(b){b.focus();const n=b.value.length;try{b.setSelectionRange(n,n);}catch(err){}}

function onChange(e){
  const el=e.target;
  if(el&&el.dataset&&el.dataset.act==='alloc'&&G){Leg.setAlloc(G,el.dataset.key,+el.value);save();render();return;}
  if(!el||el.id!=='save-file')return;
  const file=el.files&&el.files[0];
  el.value='';

  file.text().then(text=>{
    try{
      G=Core.loadSave(text);tab='hub';

      toast(`${G.school} added to your careers: season ${G.season}, week ${G.week}.`);

}

function ring(v,label,sub){

function radar(attr){
  const K=Coach.KEYS,n=K.length,R=58,cx=80,cy=80;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return `${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`;};
  const grid=[.34,.67,1].map(f=>`<polygon class="grid" points="${K.map((_,i)=>pt(i,R*f)).join(' ')}"/>`).join('');
  const spokes=K.map((_,i)=>`<line class="grid" x1="${cx}" y1="${cy}" x2="${pt(i,R).split(',')[0]}" y2="${pt(i,R).split(',')[1]}"/>`).join('');
  const shape=K.map((k,i)=>pt(i,R*clamp((attr[k]-35)/64,.06,1))).join(' ');
  const labels=K.map((k,i)=>{const [x,y]=pt(i,R+13).split(',');return `<text x="${x}" y="${+y+3}" text-anchor="middle">${k}</text>`;}).join('');
  return `<svg class="radar" viewBox="0 0 160 160" role="img" aria-label="Attribute radar">${grid}${spokes}<polygon class="shape" points="${shape}"/>${labels}</svg>`;
}

function alerts(){
  const out=[],abs=Core.wk(G);
  for(const p of G.roster){
    if(p.injured)out.push(['bad',`${p.name} is out ${p.injuredWeeks} week${p.injuredWeeks===1?'':'s'}.`,'roster']);
    else if((p.morale??70)<40)out.push(['bad',`${p.name} is unhappy (morale ${Math.round(p.morale)}). Meet with her or find her minutes.`,'roster']);
    else if((p.fatigue||0)>=60&&(G.lineup||[]).includes(p.id))out.push(['warn',`${p.name} is running on empty (fatigue ${Math.round(p.fatigue)}).`,'tactics']);
  }
  if((G.lineup||[]).length<5)out.push(['warn','Your starting five has an open slot.','roster']);
  for(const p of [...G.prospects,...G.portal]){
    if(p.committed||p.signedElsewhere||!p.recruit2)continue;
    const left=p.recruit2.deadline-abs;
    if(p.offered&&left<=2&&left>=0){const r=Coach.race(G,p);out.push([r.lead>=0?'good':'warn',`${p.name} decides in ${left} week${left===1?'':'s'}. You are ${r.lead>=0?'ahead of':'behind'} ${r.best.school}.`,'board']);}
  }
  for(const pr of G.promises){
    if(pr.status==='Open'&&Number.isFinite(pr.due)&&pr.due-abs<=1&&(pr.evidence||[]).length<2&&pr.kind!=='minutes'&&pr.kind!=='nil-guarantee')out.push(['warn',`Promise to ${pr.name} needs follow-up evidence.`,'promises']);
    if(pr.status==='Broken')out.push(['bad',`Broken promise to ${pr.name} can still be repaired.`,'promises']);
  }
  const short=Coach.needs(G).filter(n=>n.short>0);
  if(short.length)out.push(['info',`Next season you are thin at ${short.map(n=>`${n.pos} (${n.have}/${n.want})`).join(', ')}.`,'board']);
  const c=G.coach;
  if(c.fam.off<40)out.push(['info',`Offense familiarity is ${c.fam.off}. Practice time on the offense will lift it.`,'tactics']);
  if(c.fam.def<40)out.push(['info',`Defense familiarity is ${c.fam.def}. Practice time on the defense will lift it.`,'tactics']);
  return out;
}

function wantsHTML(p){
  const v=Coach.view(p),rp=p.rp,gr=Coach.grades(G,p),out=[];
  const chip=k=>`<span class="want ${gradeTone(gr[k])}"><i></i>${esc(Coach.FLABEL[k])}<b>${Math.round(gr[k])}</b></span>`;

  if(v.potential){
    const f=Coach.sysFit(G,p);
    out.push(`<span class="want plain">Potential <b>${Coach.potGrade(p)}</b></span><span class="want plain">${esc(Coach.archetype(p))}</span><span class="want plain ${tone(f)}">${f>=.3?'Raises':f<=-.3?'Lowers':'Neutral for'} System Fit <b>${sgn(f)}</b></span>`);

function playerCard(p){

    `<button data-act="promise" data-id="${p.id}" data-kind="${k}">${esc(t.label)}<small>${t.cost?(t.pool==='nil'?money(t.cost)+' NIL':money(t.cost)):'free'}</small></button>`).join('')}</div></details>`;

const HOOP=[887,250];
const OFFP=[[640,250],[735,95],[735,405],[815,150],[835,330]];
function courtSVG(m){
  const L=m.last,usOff=!L||L.off==='us';
  const flip=([x,y])=>[940-x,y];
  const offT=usOff?m.us:m.them,defT=usOff?m.them:m.us;
  const of=Match.floor(offT),df=Match.floor(defT);
  const spots=of.map((p,i)=>{
    let s=OFFP[i]||OFFP[4];
    if(L&&!L.to&&!L.ft&&L.shooter===i&&L.x)s=[L.x,L.y];
    return s;
  });
  const dspots=spots.map(s=>[s[0]+(HOOP[0]-s[0])*.3,s[1]+(HOOP[1]-s[1])*.3]);
  const place=p=>usOff?p:flip(p);
  const dots=[];
  const dot=(p,pos,ours,key)=>{
    const [x,y]=place(pos),prev=livePrev[key]||[x,y];
    livePrev[key]=[x,y];
    return `<g class="dot ${ours?'us':'them'}${p.en<55?' tired':''}" style="--fx:${prev[0]-x}px;--fy:${prev[1]-y}px" transform="translate(${x} ${y})"><circle r="19"/><text y="6" text-anchor="middle">${esc(ours?(p.num??p.pos):p.pos==='Wing'?'W':p.pos)}</text></g>`;
  };
  of.forEach((p,i)=>dots.push(dot(p,spots[i],usOff,(usOff?'u':'t')+p.id)));
  df.forEach((p,i)=>dots.push(dot(p,dspots[i]||dspots[0],!usOff,(usOff?'t':'u')+p.id)));
  let ball='',mark='';
  if(L){
    const path=[place(OFFP[0])];
    if(L.passer>=0&&spots[L.passer])path.push(place(spots[L.passer]));
    if(L.to)path.push(place(dspots[Math.max(0,L.shooter)]||dspots[0]));
    else{path.push(place(spots[Math.max(0,L.shooter)]||spots[0]));if(!L.ft)path.push(place(HOOP));}
    ball=`<circle class="ball" r="9" data-path="${path.map(p=>p.map(Math.round).join(',')).join(' ')}" cx="0" cy="0" transform="translate(${path[path.length-1].map(Math.round).join(' ')})"/>`;
    if(!L.to&&!L.ft&&L.x){const [sx,sy]=place([L.x,L.y]);mark=`<g class="shotmark ${L.made?'made':'miss'}" transform="translate(${sx} ${sy})">${L.made?'<circle r="26"/>':'<path d="M-12-12 12 12M12-12-12 12"/>'}</g>`;}
  }
  const half=x=>`<path d="M${x?940:0} 30H${x?801:139}A232 232 0 0 ${x?0:1} ${x?801:139} 470H${x?940:0}"/><rect x="${x?750:0}" y="170" width="190" height="160"/><circle cx="${x?750:190}" cy="250" r="60"/><circle class="rimc" cx="${x?887:53}" cy="250" r="9"/><path d="M${x?900:40} 220V280"/>`;
  return `<svg class="lcourt" viewBox="0 0 940 500" role="img" aria-label="Court">
    <defs><linearGradient id="lwood" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3b2b18"/><stop offset="1" stop-color="#22190e"/></linearGradient></defs>
    <rect class="lfloor" width="940" height="500" rx="10"/>
    <g class="llines"><rect x="1" y="1" width="938" height="498" rx="10"/><path d="M470 0V500"/><circle cx="470" cy="250" r="60"/>${half(0)}${half(1)}</g>
    <text class="lmono" x="470" y="262" text-anchor="middle">${esc(initials(m.home?m.us.name:m.them.name))}</text>
    ${mark}${dots.join('')}${ball}
  </svg>`;
}

function liveAnimate(){
  const b=document.querySelector('.lcourt .ball');
  if(!b||!b.dataset.path||REDUCE.matches||!b.animate)return;

}

function analyticsHTML(){
  const an=G.an;
  if(!an||!an.n)return `<p class="empty" style="margin-top:20px">No games yet this season. Every game you play or sim fills this page: four factors, shot profile and player efficiency.</p>`;
  const f=t=>{const poss=Math.max(1,t.poss);return {poss:Math.round(t.poss/an.n),ppp:(t.fgm*2+t.tpm+t.ftm)/poss,efg:t.fga?(t.fgm+.5*t.tpm)/t.fga:0,tov:t.to/poss,ftr:t.fga?t.fta/t.fga:0,three:t.tpa?t.tpm/t.tpa:0,rim:t.rimA?t.rim/t.rimA:0,rate3:t.fga?t.tpa/t.fga:0,
    fg:`${t.fgm}-${t.fga}`,tp:`${t.tpm}-${t.tpa}`,ft:`${t.ftm}-${t.fta}`};};
  const a=f(an.us),b=f(an.them);
  a.orbp=an.us.orb/Math.max(1,an.us.orb+an.them.drb);b.orbp=an.them.orb/Math.max(1,an.them.orb+an.us.drb);
  const edges=[['shooting',a.efg-b.efg,1],['ball security',b.tov-a.tov,1],['the offensive glass',a.orbp-b.orbp,.5],['getting to the line',a.ftr-b.ftr,.35]].map(x=>[x[0],x[1]*x[2]]).sort((x,y)=>y[1]-x[1]);
  const shots=(G.schedule||[]).filter(x=>x.box&&x.box.shots).flatMap(x=>x.box.shots);
  const players=G.roster.filter(p=>p.tot&&p.tot.min>0).sort((x,y)=>y.tot.pts-x.tot.pts);
  const tmin=players.reduce((s,p)=>s+p.tot.min,0)||1,tuse=players.reduce((s,p)=>s+p.tot.fga+.44*p.tot.fta+p.tot.to,0)||1;
  return `<section class="split" style="margin-top:18px">
    <article class="card reveal"><header><h2>Four factors</h2><span class="badge">${an.n} games</span></header>
      <div class="summary-grid" style="margin:12px 0"><div class="bigstat"><span>Points for</span><b>${(an.pf/an.n).toFixed(1)}</b></div><div class="bigstat"><span>Points against</span><b>${(an.pa/an.n).toFixed(1)}</b></div><div class="bigstat"><span>Net / 100 poss</span><b class="${a.ppp>=b.ppp?'pos':'neg'}">${sgn((a.ppp-b.ppp)*100)}</b></div><div class="bigstat"><span>Pace</span><b>${a.poss}</b></div></div>
      ${factorRows(a,b,G.school,'Opponents')}
      <p class="whyline">You win with <b>${edges[0][0]}</b>. Your biggest leak is <b>${edges[edges.length-1][0]}</b>.</p>
    </article>
    <article class="card reveal"><header><h2>Shot profile</h2><span class="badge">${pct(a.rate3)} from three</span></header>
      ${shotChart(shots.slice(-700))}
      <div class="meters">${bar('At the rim',a.rim*100)}${bar('From three',a.three*100*2)}${bar('At the line',an.us.fta?an.us.ftm/an.us.fta*100:0)}</div>
      <p class="hint">Three-point bar is doubled so 50% fills it. Chart shows your most recent 700 shots.</p>
    </article>
  </section>
  ${sec('Player efficiency',`${G.season>1?'this season':'season to date'}`)}
  <div class="tablewrap reveal"><table class="grid boxt"><thead><tr><th>Player</th><th>G</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>TS%</th><th>USG%</th><th>AST/TO</th><th>3P%</th><th>STL</th></tr></thead><tbody>
  ${players.map(p=>{const t=p.tot,g=Math.max(1,p.games||1),ts=t.fga+.44*t.fta?t.pts/(2*(t.fga+.44*t.fta)):0,usg=(t.fga+.44*t.fta+t.to)/tuse/(t.min/tmin)*.2;
    return `<tr><td><button class="namebtn" data-act="player" data-id="${p.id}"><i>${esc(p.num??'')}</i><span><b>${esc(p.name)}</b></span></button></td><td>${g}</td><td>${(t.min/g).toFixed(1)}</td><td><b>${(t.pts/g).toFixed(1)}</b></td><td>${(t.reb/g).toFixed(1)}</td><td>${(t.ast/g).toFixed(1)}</td><td class="${ts>=.56?'pos':ts<.46?'neg':''}">${pct1(ts)}</td><td>${pct1(usg)}</td><td>${t.to?(t.ast/t.to).toFixed(1):'—'}</td><td>${t.tpa?pct1(t.tpm/t.tpa):'—'}</td><td>${(t.stl/g).toFixed(1)}</td></tr>`;}).join('')}
  </tbody></table></div>
  ${highsHTML()}${playReport()}<p class="hint" style="margin-top:10px">TS% is true shooting. USG% is the share of your possessions a player finishes while she is on the floor.</p>`;
}

function fitOf(key){
  const five=(Coach.report(G,null).unit.five||[]).slice(),play=Match.PLAYS[key],used=new Set();let s=0,n=0;
  for(const [,attrs] of play.roles){
    const pool=five.filter(p=>!used.has(p.id));if(!pool.length)break;
    const sc=p=>{const at=p.attr?Match.derive(p.attr):null;return attrs.reduce((a,k)=>a+(at&&Number.isFinite(at[k])?at[k]:p.ovr),0)/attrs.length-p.ovr;};
    const best=pool.sort((a,b)=>sc(b)-sc(a))[0];used.add(best.id);s+=sc(best);n+=1;
  }
  return clamp((s/Math.max(1,n)+2.6)/3.5,-2,2);
}

function runLoop(){
  if(loopBusy)return;loopBusy=true;loopRun={rows:[],done:false};render();
  const c=JSON.parse(JSON.stringify(G));c.live=null;
  try{for(const k of ['recruit','practice','schedule'])Leg.setCtrl(c,k,'staff');}catch(e){}
  let y=0;
  const step=()=>{
    const row={season:Core.seasonLabel(c),ok:true,note:''};
    try{
      let n=0;while(c.week<28&&n++<160){if(Sim.pendingGame(c)){Sim.playNextGame(c);continue;}Sim.nextWeek(c,{auto:false});}
      if(c.week<28){row.ok=false;row.note=`stuck at week ${c.week}`;}
      const rec=`${c.record.w}-${c.record.l}`,nil=Core.nilLocked(c)?'NIL locked':'NIL open';
      Prog.seasonEnd(c);World.roll(c);Core.rollover(c);Coach.offseason(c);Prog.newSeason(c);
      const cl=c.prospects.length,ro=c.roster.length,sc=(c.schedule||[]).length;
      if(ro<8||ro>Core.CAP){row.ok=false;row.note+=` roster ${ro}`;}
      if(!cl){row.ok=false;row.note+=' empty recruiting board';}
      if(sc<20){row.ok=false;row.note+=` schedule ${sc}`;}
      row.note=row.note||`${rec} · roster ${ro} · board ${cl} · ${nil}`;
    }catch(e){row.ok=false;row.note=e.message||String(e);}
    loopRun.rows.push(row);y+=1;
    if(y<10&&row.ok){render();setTimeout(step,30);}
    else{loopRun.done=true;loopBusy=false;World.apply(G);Core.setYear(G.startYear);render();toast(loopRun.rows.every(r=>r.ok)?'Ten seasons, no stuck stages.':'The loop stopped. See the Loop Check.',!loopRun.rows.every(r=>r.ok));}
  };
  setTimeout(step,30);
}

  const T=Match.rules(m),left=m.ot?m.clock/60:((T.periods-m.per)*T.len+m.clock)/60,d=m.us.score-m.them.score;
  const edge=(m.us.edge-m.them.edge)*.25,z=(d+edge*left/40)/Math.sqrt(Math.max(.25,left)*2.4+.6);

}

/* ---------------- motion ---------------- */
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)');
const SDA=!!(window.CSS&&CSS.supports&&CSS.supports('animation-timeline: view()'));
if(!SDA)document.documentElement.classList.add('no-sda');
let io=null;
if(!SDA&&'IntersectionObserver' in window){
  io=new IntersectionObserver(entries=>{
    let n=0;
    for(const en of entries){
      if(!en.isIntersecting)continue;
      en.target.style.setProperty('--sd',`${Math.min(n++,6)*60}ms`);
      en.target.classList.add('in');
      io.unobserve(en.target);
    }
  },{rootMargin:'0px 0px -8% 0px',threshold:.05});
}
function motion(fresh){
  if(SDA||REDUCE.matches||!io){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in','instant'));return;}
  const vh=innerHeight;
  document.querySelectorAll('.reveal:not(.in)').forEach((el,i)=>{
    const r=el.getBoundingClientRect();
    if(r.top<vh*.96&&r.bottom>0){
      /* in view at render time: animate only on a fresh screen, otherwise just show it */
      if(fresh){el.style.setProperty('--sd',`${Math.min(i,8)*55}ms`);requestAnimationFrame(()=>el.classList.add('in'));}
      else el.classList.add('in','instant');
    }else io.observe(el);
  });
}
let ticking=false;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    const y=scrollY,max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
    document.body.classList.toggle('scrolled',y>36);
    if(!SDA){
      const root=document.documentElement.style;
      root.setProperty('--hp',Math.min(1,y/(innerHeight*.85)).toFixed(3));
      const bar=document.querySelector('.progress');
      if(bar)bar.style.setProperty('--p',(y/max).toFixed(4));
    }
  });
}
function animateCounts(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const k=el.dataset.count,to=+el.dataset.val,from=prevCounts[k];
    prevCounts[k]=to;
    if(from===undefined||from===to||REDUCE.matches)return;
    el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
    const fmt=el.dataset.fmt==='money'?money:(n=>String(Math.round(n)));
    const t0=performance.now(),dur=650;
    const step=t=>{
      const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      el.textContent=fmt(Math.round(from+(to-from)*e));
      if(p<1&&el.isConnected)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

    screen='start';
    app.innerHTML=startHTML()+fileInputHTML();

  }else if(G.live&&G.live.v===4){
    Core.setYear(G.startYear);

    screen='live:'+CID;
    app.innerHTML=liveHTML();

    World.apply(G);Coach.ensure(G);Prog.ensure(G);
    G.coach.book=Match.checkBook(G.coach.book,G.tactics.offense);

    const body=asstBanner()+(bodies[tab]||hubHTML)();
    const fresh=screen!==lastScreen;
    app.innerHTML=`<div class="app" style="${teamVars(G.school)}">${railHTML()}<div class="main">${headerHTML()}${pageHead()}<main class="${fresh?'enter':''}">${body}</main></div></div>${fileInputHTML()}`;
    document.body.style.cssText=teamVars(G.school);
    for(const m of [summaryHTML(),playerHTML(),gameBoxHTML(),slatePickHTML(),postBoxHTML(),selectionHTML(),creatorHTML(),pickHTML(),timeoutHTML(),boxHTML(),conversationHTML(),saveHTML()])if(m)modals.push(m);
  }
  if(!G)document.body.style.cssText='';
  const m=modals[modals.length-1];
  if(m){
    const same=m.key===lastModal;
    app.insertAdjacentHTML('beforeend',`<div class="overlay${same?' noanim':''}">${m.html}</div>`);
    lastModal=m.key;
  }else lastModal='';
  const fresh=screen!==lastScreen;
  lastScreen=screen;
  motion(fresh);
  animateCounts();
  onScroll();
}

    return;
  }
  if(act==='export'){downloadSave();return;}

    const t=saveModal&&saveModal.text;

  if(act==='inj'){G.injOff=el.dataset.val==='off';save();render();return;}
  if(act==='slate-pick'){slatePick=+el.dataset.i;const gm=G.schedule[slatePick];slateSite=Prog.siteOf(gm);render();return;}
  if(act==='slate-close'){slatePick=null;render();return;}
  if(act==='slate-filter'){slateFilter=el.dataset.val;render();return;}
  if(act==='slate-sitef'){slateSite=el.dataset.val;render();return;}
  if(act==='slate-set'){try{const d=Prog.setGame(G,slatePick,el.dataset.school,slateSite);slatePick=null;save();render();toast(`${d.school} booked: ${Math.round(d.win*100)}% win chance, ${money(d.money)}.`);}catch(e){toast(e.message,true);}return;}
  if(act==='slate-site'){try{Prog.setSite(G,+el.dataset.i,el.dataset.val);save();render();}catch(e){toast(e.message,true);}return;}
  if(act==='slate-plan'){try{Prog.autofill(G,el.dataset.val);save();render();toast(`${Prog.PLANS[el.dataset.val][0]}: schedule rebuilt.`);}catch(e){toast(e.message,true);}return;}
  if(act==='pbox'){boxPost={key:el.dataset.key,i:+el.dataset.i};render();return;}
  if(act==='sel-close'){if(G.pg&&G.pg.sel)G.pg.sel.seen=true;tab='postseason';save();render();scrollTo({top:0});return;}
  if(act==='cc-bg'){const n=$('#cc-name');if(n)G.manager=n.value||G.manager;ccBg=el.dataset.key;render();return;}
  if(act==='cc-diff'){const n=$('#cc-name');if(n)G.manager=n.value||G.manager;ccDiff=el.dataset.key;render();return;}
  if(act==='cc-focus'){const n=$('#cc-name');if(n)G.manager=n.value||G.manager;ccFocus=el.dataset.key;render();return;}
  if(act==='cc-go'){const n=$('#cc-name');return run(()=>{Prog.create(G,(n&&n.value)||G.manager||'Coach',ccBg);Leg.setDiff(G,ccDiff);if(G.career==='asst'&&!G.asst)Leg.asstStart(G,ccFocus);},G.career==='asst'?'You are on the staff. Earn the rating; the offers follow.':'Your staff is waiting on the practice floor.');}
  if(act==='day'){try{const l=Prog.doDay(G,el.dataset.key);save();render();toast(`${l}: done.`);}catch(e){toast(e.message,true);}return;}
  if(act==='ret'){try{const msg=Prog.retPitch(G,el.dataset.id,el.dataset.key);save();render();toast(msg);}catch(e){toast(e.message,true);}return;}
  if(act==='skill')return run(()=>Prog.learn(G,el.dataset.key),'Skill learned.');
  if(act==='asst-match'){try{const msg=Prog.matchOffer(G,el.dataset.id);save();render();toast(msg);}catch(e){toast(e.message,true);}return;}
  if(act==='asst-go'){try{const msg=Prog.letGo(G,el.dataset.id);save();render();toast(msg);}catch(e){toast(e.message,true);}return;}
  if(act==='asst-hire'){try{const msg=Prog.hire(G,el.dataset.id);save();render();toast(msg);}catch(e){toast(e.message,true);}return;}
  if(act==='job'){pendingJob=+el.dataset.i;render();return;}
  if(act==='job-no'){pendingJob=null;render();return;}
  if(act==='job-yes'){
    try{
      save();const ng=Prog.takeJob(G,+el.dataset.i);G=ng;pendingJob=null;tab='hub';
      CID=Careers.create(localStorage,G);save();render();scrollTo({top:0});toast(`${G.school} is yours.`);
    }catch(e){toast(e.message||String(e),true);}
    return;
  }
  if(act==='pb-w'||act==='pb-r'||act==='pb-risk'||act==='pb-counter'||act==='pb-late'||act==='pb-reset'){
    const b=G.coach.book,k=el.dataset.key,v=el.dataset.val;
    if(act==='pb-w'){b.w[k]=+v;if(!Match.CALLS.some(x=>b.w[x]>0)){b.w[k]=1;toast('You need at least one call.',true);}}
    if(act==='pb-r'){const was=b.reps[k];b.reps[k]=+v;if(Match.repsUsed(b)>Match.REPS_MAX){b.reps[k]=was;toast(`Only ${Match.REPS_MAX} practice reps to go around. Take some off another set first.`,true);return;}}
    if(act==='pb-risk')b.risk=v;
    if(act==='pb-counter')b.counter=v;
    if(act==='pb-late')b.late=v;
    if(act==='pb-reset')G.coach.book=Match.defaultBook(G.tactics.offense);
    save();render();return;
  }
  if(act==='close-box'){G.lastBox=null;G.lastBoxMore=false;save();render();return;}
  if(act==='lineup'){
    const id=el.dataset.id;
    const r=Core.setStarter(G,id);
    const p=Core.playerBy(G,id)||{};
    if(!r.ok){toast(r.reason,true);render();return;}
    save();render();
    toast(r.starter?`${p.name} is in the starting five.`:`${p.name} moves to the bench.`);
    return;
  }
  if(act==='bench'){
    const name=el.dataset.name||'';
    G.swapping=G.swapping===name?null:name;
    render();
    return;
  }
  if(act==='insert'){
    const live=Sim.substitute(G,el.dataset.in,el.dataset.out);
    G.swapping=null;
    if(!live){toast('That swap is not available.',true);render();return;}
    save();render();
    return;
  }
  if(act==='timeout'){
    const key=el.dataset.key||'';
    G.swapping=null;
    const r=Sim.coachTimeout(G,key);
    if(!r){toast('Nothing is waiting on a timeout.',true);return;}
    G.lastBox=r.box;
    G.lastBox.effect=r.effect;
    G.lastBoxMore=!!Sim.queuedTournament(G);
    save();render();
    return;
  }
  if(act==='sim'){
    let guard=0;
    while(G.week<24&&guard++<30)Sim.nextWeek(G);
    save();render();
    toast(`Simmed to week ${G.week}. Record ${G.record.w}-${G.record.l}.`);
    return;
  }
  if(act==='tactic')return run(()=>Coach.setTactic(G,el.dataset.kind,el.dataset.val));
  if(act==='depth')return run(()=>Coach.setDepth(G,el.dataset.val));
  if(act==='practice')return run(()=>Coach.setPractice(G,el.dataset.field,el.dataset.val));
  if(act==='staff-up')return run(()=>Coach.upgradeStaff(G,el.dataset.id),'Staff upgraded.');
  if(act==='fac-up')return run(()=>Coach.upgradeFacility(G,el.dataset.id),'Facility upgraded.');
  if(act==='pitch'){
    try{
      const r=Coach.pitch(G,el.dataset.id,el.dataset.key);
      save();render();
      toast(`${r.verdict} Interest ${r.delta>=0?'+':''}${r.delta}${r.priority?' — it is one of her priorities':''}.`,r.delta<0);
    }catch(e){toast(e.message||String(e),true);}
    return;
  }
  if(act==='nil')return run(()=>Coach.setNil(G,el.dataset.id,el.dataset.tier));
  if(act==='player'){playerModal=el.dataset.id;render();return;}
  if(act==='close-player'){playerModal=null;render();return;}
  if(act==='focus')return run(()=>Coach.setFocus(G,el.dataset.id,el.dataset.key));
  if(act==='meet')return run(()=>Coach.meet(G,el.dataset.id));
  if(act==='box'){boxModal=+el.dataset.i;render();return;}
  if(act==='close-gbox'){boxModal=null;render();return;}
  if(act==='t-live'){
    const x=Sim.pendingGame(G);
    if(!x){toast('No tournament game is waiting.',true);return;}
    G.live=Match.create(G,x.gm);G.liveT=1;livePrev={};livePick=null;liveTab='feed';save();render();scrollTo({top:0});
    return;
  }
  if(act==='live-start'){
    const ng=canCoachLive();
    if(!ng){toast('There is no game to coach this week.',true);return;}
    G.live=Match.create(G,G.schedule[ng.index]);G.liveGi=ng.index;
    livePrev={};livePick=null;liveTab='feed';save();render();scrollTo({top:0});
    return;
  }
  if(act&&act.startsWith('live-')&&G.live){
    const m=G.live;
    try{
      if(act==='live-step'){stopPlay();Match.step(m);liveStepAnim=true;}
      else if(act==='live-play'){
        if(livePlaying)stopPlay();
        else{m.pause='';livePlaying=true;liveTimer=setInterval(()=>{
          if(!G||!G.live||G.live.done||G.live.pause){stopPlay();render();return;}
          Match.step(G.live);liveStepAnim=true;save();render();
        },950);}
      }
      else if(act==='live-sim'){stopPlay();if(el.dataset.to==='end')Match.simAll(m);else Match.simUntil(m,el.dataset.to);m.atHalf=false;}
      else if(act==='live-mode'){Match.setMode(m,el.dataset.val);G.coach.liveMode=m.mode;}
      else if(act==='live-plan'){Match.setPlan(m,el.dataset.key,el.dataset.id);}
      else if(act==='live-pkg'){Match.setPackage(m,el.dataset.key);}
      else if(act==='live-half'){Match.setHalf(m,el.dataset.side,el.dataset.key);const keep=m.pause;save();render();return;}
      else if(act==='live-to'){Match.timeout(m);}
      else if(act==='live-adj'){Match.setAdj(m,el.dataset.key,el.dataset.val);}
      else if(act==='live-shout'){const note=Match.shout(m,el.dataset.key);toast(note);}
      else if(act==='live-auto'){m.auto=!m.auto;}
      else if(act==='live-call'){Match.call(m,el.dataset.key);}
      else if(act==='live-tab'){liveTab=el.dataset.val;}
      else if(act==='live-pick'){livePick=livePick===+el.dataset.i?null:+el.dataset.i;}
      else if(act==='live-out'){
        if(livePick==null){toast('Pick a bench player first, then tap who she replaces.');}
        else{const r=Match.sub(m,livePick,+el.dataset.i);m.auto=false;livePick=null;if(r==='queued')toast('Queued. She checks in at the next whistle.');}
      }
      else if(act==='live-finish'){
        stopPlay();
        if(G.liveT){
          const r=Sim.playNextGame(G,m);
          G.live=null;G.liveT=0;livePrev={};tab='hub';
          if(r&&r.tournament)boxPost={key:r.tournament.key,i:r.tournament.rounds.length-1};
          save();render();return;
        }
        Match.finish(m,G,G.schedule[G.liveGi]);
        G.live=null;G.liveGi=null;livePrev={};tab='hub';save();render();
        const b=document.querySelector('[data-act="week"]');
        if(b)b.click();
        return;
      }
    }catch(e){toast(e.message||String(e),true);}
    save();render();
    return;
  }
  if(act==='board-tier'){boardTier=el.dataset.val;render();return;}
  if(act==='watch-cls'){watchCls=el.dataset.val;render();return;}
  if(act==='tier')return run(()=>{const p=Coach.setTier(G,el.dataset.id,el.dataset.tier);toast(el.dataset.tier==='watch'?`${p.name} moved back to the watchlist.`:el.dataset.tier==='top'?`${p.name} is in your Top 5.`:`${p.name} is on your Active Board.`);});
  if(act==='visit-open'||act==='home-open'){visitModal={id:el.dataset.id,kind:act==='home-open'?'home':'visit',picks:[]};render();return;}
  if(act==='pick'){
    if(!visitModal)return;
    const k=el.dataset.key,i=visitModal.picks.indexOf(k);
    if(i>=0)visitModal.picks.splice(i,1);else visitModal.picks.push(k);
    render();return;
  }
  if(act==='pick-cancel'){visitModal=null;render();return;}
  if(act==='pick-go'){
    if(!visitModal)return;
    const m=visitModal;
    try{
      const r=m.kind==='home'?Coach.homeVisit(G,m.id,m.picks):Coach.visit(G,m.id,m.picks);
      visitModal=null;save();render();
      toast(m.kind==='home'?`${r.label}: ${r.hits} of her 2 priorities covered. Momentum ${r.mom>=0?'+':''}${r.mom}.`:`${r.label}: ${r.hits} of 4 stops were what she wanted. Momentum ${r.mom>=0?'+':''}${r.mom}.`,r.mom<0);
    }catch(e){toast(e.message||String(e),true);}
    return;
  }
  if(act==='close-rec'){
    try{
      const r=Coach.close(G,el.dataset.id);
      save();render();
      toast(r.ok?'She committed. Keep in touch until she signs.':r.rushed?'Too early. She felt pushed, and trust took a hit.':r.blocked?`She will not commit without ${r.blocked}.`:r.lost?`She chose ${r.lost}.`:'She is not ready to choose yet.',!r.ok);
    }catch(e){toast(e.message||String(e),true);}
    return;
  }
  if(act==='checkin')return run(()=>Coach.checkIn(G,el.dataset.id));
  if(act==='action')return run(()=>Coach.act(G,el.dataset.id,el.dataset.kind));
  if(act==='talk')return run(()=>{Core.conversation(G,el.dataset.id);Coach.touch(G,el.dataset.id,.3);});
  if(act==='answer')return run(()=>Core.answer(G,el.dataset.key));
  if(act==='offer')return run(()=>Coach.offer(G,el.dataset.id));
  if(act==='promise')return run(()=>Core.promise(G,el.dataset.id,el.dataset.kind));
  if(act==='task')return run(()=>Core.task(G,el.dataset.id,el.dataset.kind||'session'));
  if(act==='repair')return run(()=>Core.task(G,el.dataset.id,'repair'));
  if(act==='exit')return run(()=>{Core.enterPortal(G,el.dataset.id);playerModal=null;},'She is in the transfer portal.');
  if(act==='rollover')return run(()=>{
    const moved=World.roll(G);
    Prog.seasonEnd(G);
    const out=Core.rollover(G);
    Coach.offseason(G);
    const pay=Prog.newSeason(G);boxPost=null;
    G.lastBox=null;G.lastBoxMore=false;playerModal=null;tab='hub';
    toast(`Season ${out.season}: budget ${money(out.finances.budget)}, NIL ${money(out.finances.nilPool)}, promises ${out.promises.kept} kept / ${out.promises.broken} broken.`);
  });
}
function onKey(e){
  if(e.key!=='Escape')return;
  if(pendingDelete){pendingDelete=null;render();}
  else if(slatePick!=null){slatePick=null;render();}
  else if(boxPost){boxPost=null;render();}
  else if(boxModal!=null){boxModal=null;render();}
  else if(visitModal){visitModal=null;render();}
  else if(playerModal){playerModal=null;render();}
  else if(saveModal){saveModal=null;render();}
  else if(G&&G.lastBox&&!liveTimeout()){G.lastBox=null;G.lastBoxMore=false;save();render();}
  else if(G&&G.recruitConversation&&G.recruitConversation.answered){G.recruitConversation=undefined;save();render();}
}

/* ---------------- boot ---------------- */
(function boot(){
  try{
    Careers.migrate(localStorage);
    const id=Careers.activeId(localStorage);
    if(id){const game=Careers.load(localStorage,id);if(game){G=game;CID=id;document.documentElement.classList.add('intro-done');}}
  }catch(e){G=null;CID=null;}
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKey);
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',onScroll,{passive:true});
  render();
})();
})();

</script>
</body>
</html>
